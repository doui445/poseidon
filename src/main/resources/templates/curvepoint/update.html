<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:replace="~{fragments/head :: head-css}"></th:block>
	<title>Update Curve Point</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: headerNav}"></div>

<div class="container">
	<div class="row">
		<h2>Update CurvePoint</h2>
	</div>

	<div class="row">
		<form action="#" class="form-horizontal" method="post"
		      style="width: 100%" th:action="@{/curvepoint/update/{id}(id=${curvePoint.id})}" th:object="${curvePoint}">

			<input th:field="*{id}" type="hidden">

			<div class="form-group">
				<label class="col-sm-2 col-form-label" for="curveId">Curve Id</label>
				<div class="col-sm-4">
					<input class="form-control" id="curveId" placeholder="Curve Id" th:field="*{curveId}" type="number">
					<p class="text-danger" th:errors="*{curveId}" th:if="${#fields.hasErrors('curveId')}"></p>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 col-form-label" for="term">Term</label>
				<div class="col-sm-10">
					<input class="col-4" id="term" placeholder="Type" step="0.01" th:field="*{term}" type="number">
					<p class="text-danger" th:errors="*{term}" th:if="${#fields.hasErrors('term')}"></p>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 col-form-label" for="value">Value</label>
				<div class="col-sm-10">
					<input class="col-4" id="value" placeholder="Value" step="0.01" th:field="*{value}" type="number">
					<p class="text-danger" th:errors="*{value}" th:if="${#fields.hasErrors('value')}"></p>
				</div>
			</div>

			<div class="form-group">
				<div class="col-sm-12">
					<a class="btn btn-danger btn-sm" th:href="@{/curvepoint/list}">Cancel</a>
					<input class="btn btn-primary btn-sm" type="submit" value="Update Curve Point">
				</div>
			</div>
		</form>
	</div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
