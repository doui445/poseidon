<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:replace="~{fragments/head :: head-css}"></th:block>
	<title>Add New Trade</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: headerNav}"></div>

<div class="container">
	<div class="row">
		<h2>Add New Trade</h2>
	</div>

	<div class="row">
		<form action="#" class="form-horizontal" method="post" style="width: 100%" th:action="@{/trade/validate}"
		      th:object="${trade}">

			<div class="form-group">
				<label class="col-sm-2 col-form-label" for="account">Account</label>
				<div class="col-sm-10">
					<input class="col-4" id="account" placeholder="Account" th:field="*{account}" type="text">
					<p class="text-danger" th:errors="*{account}" th:if="${#fields.hasErrors('account')}"></p>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 col-form-label" for="type">Type</label>
				<div class="col-sm-10">
					<input class="col-4" id="type" placeholder="Type" th:field="*{type}" type="text">
					<p class="text-danger" th:errors="*{type}" th:if="${#fields.hasErrors('type')}"></p>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 col-form-label" for="buyQuantity">Buy Quantity</label>
				<div class="col-sm-10">
					<input class="col-4" id="buyQuantity" placeholder="Buy Quantity" step="0.01"
					       th:field="*{buyQuantity}" type="number">
					<p class="text-danger" th:errors="*{buyQuantity}" th:if="${#fields.hasErrors('buyQuantity')}"></p>
				</div>
			</div>


			<div class="form-group">
				<div class="col-sm-12">
					<a class="btn btn-danger btn-sm" th:href="@{/trade/list}">Cancel</a>
					<input class="btn btn-primary btn-sm" type="submit" value="Add Trade">
				</div>
			</div>
		</form>
	</div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
