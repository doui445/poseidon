<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:replace="~{fragments/head :: head-css}"></th:block>
	<title>Add New Rating</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: headerNav}"></div>

<div class="container">
	<div class="row">
		<h2>Add New Rating</h2>
	</div>

	<div class="row">
		<form action="#" class="form-horizontal" method="post" style="width: 100%" th:action="@{/rating/validate}"
		      th:object="${rating}">

			<div class="form-group">
				<label class="col-sm-2 col-form-label" for="moodysRating">Moody's Rating</label>
				<div class="col-sm-10">
					<input class="col-4" id="moodysRating" placeholder="ex: Aaa" th:field="*{moodysRating}" type="text">
					<p class="text-danger" th:errors="*{moodysRating}" th:if="${#fields.hasErrors('moodysRating')}"></p>
				</div>
			</div>

			<div class="form-group">
				<label class="col-sm-2 col-form-label" for="sandPRating">S&P Rating</label>
				<div class="col-sm-10">
					<input class="col-4" id="sandPRating" placeholder="ex: AAA" th:field="*{sandPRating}" type="text">
					<p class="text-danger" th:errors="*{sandPRating}" th:if="${#fields.hasErrors('sandPRating')}"></p>
				</div>
			</div>

			<div class="form-group">
				<label class="col-sm-2 col-form-label" for="fitchRating">Fitch Rating</label>
				<div class="col-sm-10">
					<input class="col-4" id="fitchRating" placeholder="ex: AAA" th:field="*{fitchRating}" type="text">
					<p class="text-danger" th:errors="*{fitchRating}" th:if="${#fields.hasErrors('fitchRating')}"></p>
				</div>
			</div>

			<div class="form-group">
				<label class="col-sm-2 col-form-label" for="orderNumber">Order</label>
				<div class="col-sm-10">
					<input class="col-4" id="orderNumber" placeholder="Priority" th:field="*{orderNumber}"
					       type="number">
					<p class="text-danger" th:errors="*{orderNumber}" th:if="${#fields.hasErrors('orderNumber')}"></p>
				</div>
			</div>

			<div class="form-group">
				<div class="col-sm-12">
					<a class="btn btn-danger btn-sm" th:href="@{/rating/list}">Cancel</a>
					<input class="btn btn-primary btn-sm" type="submit" value="Add Rating">
				</div>
			</div>
		</form>
	</div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
