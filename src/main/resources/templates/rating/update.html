<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:replace="~{fragments/head :: head-css}"></th:block>
	<title>Update Rating</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: headerNav}"></div>

<div class="container">
	<div class="row">
		<h2>Update Rating</h2>
	</div>

	<div class="row">
		<form class="form-horizontal" method="post" style="width: 100%"
		      th:action="@{/rating/update/{id}(id=${rating.id})}" th:object="${rating}">

			<input th:field="*{id}" type="hidden">

			<div class="form-group">
				<label class="col-sm-2 col-form-label" for="moodysRating">Moody's Rating</label>
				<div class="col-sm-10">
					<input class="col-4" id="moodysRating" th:field="*{moodysRating}" type="text">
					<p class="text-danger" th:errors="*{moodysRating}" th:if="${#fields.hasErrors('moodysRating')}"></p>
				</div>
			</div>

			<div class="form-group">
				<label class="col-sm-2 col-form-label" for="sandPRating">SandPRating</label>
				<div class="col-sm-10">
					<input class="col-4" id="sandPRating" placeholder="SandPRating" th:field="*{sandPRating}"
					       type="text">
					<p class="text-danger" th:errors="*{sandPRating}" th:if="${#fields.hasErrors('sandPRating')}"></p>
				</div>
			</div>

			<div class="form-group">
				<label class="col-sm-2 col-form-label" for="fitchRating">FitchRating</label>
				<div class="col-sm-10">
					<input class="col-4" id="fitchRating" placeholder="FitchRating" th:field="*{fitchRating}"
					       type="text">
					<p class="text-danger" th:errors="*{fitchRating}" th:if="${#fields.hasErrors('fitchRating')}"></p>
				</div>
			</div>

			<div class="form-group">
				<label class="col-sm-2 col-form-label-label" for="orderNumber">Order</label>
				<div class="col-sm-10">
					<input class="col-4" id="orderNumber" th:field="*{orderNumber}" type="number">
					<p class="text-danger" th:errors="*{orderNumber}" th:if="${#fields.hasErrors('orderNumber')}"></p>
				</div>
			</div>


			<div class="form-group">
				<div class="col-sm-12">
					<a class="btn btn-danger btn-sm" th:href="@{/rating/list}">Cancel</a>
					<input class="btn btn-primary btn-sm" type="submit" value="Update Rating">
				</div>
			</div>
		</form>
	</div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
