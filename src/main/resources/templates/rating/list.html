<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:replace="~{fragments/head :: head-css}"></th:block>
	<title>Rating List</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: headerNav}"></div>

<div class="container">
	<div class="row mb-3">
		<div class="col-6"><h2>Rating List</h2></div>
		<div class="col-6 text-right">
			<a class="btn btn-primary btn-sm" th:href="@{/rating/add}">Add New</a>
		</div>
	</div>

	<div class="row">
		<table class="table table-bordered table-striped">
			<thead>
			<tr>
				<th>Id</th>
				<th>MoodysRating</th>
				<th>SandPRating</th>
				<th>FitchRating</th>
				<th>Order</th>
				<th>Action</th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="rating : ${ratings}">
				<td style="width: 10%" th:text="${rating.id}"></td>
				<td th:text="${rating.moodysRating}"></td>
				<td th:text="${rating.sandPRating}"></td>
				<td th:text="${rating.fitchRating}"></td>
				<td th:text="${rating.orderNumber}"></td>
				<td class="text-center" style="width: 15%">
					<a th:href="@{/rating/update/{id}(id=${rating.id})}">Edit</a>&nbsp;|&nbsp;
					<a onclick="return confirm('Confirm delete?')"
					   th:href="@{/rating/delete/{id}(id=${rating.id})}">Delete</a>
				</td>
			</tr>
			</tbody>
		</table>
	</div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
