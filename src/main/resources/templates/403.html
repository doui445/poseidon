<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:replace="~{fragments/head :: head-css}"></th:block>
	<title>Access Denied</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: headerNav}"></div>
<div class="container text-center mt-5">
	<h1 class="display-1 text-danger">403</h1>
	<h2>Access Denied</h2>
	<p class="lead">You do not have permission to view this resource.</p>
	<hr>
	<p th:text="${errorMsg}"></p>
	<a class="btn btn-primary" th:href="@{/}">Back to Home</a>
</div>
</body>
</html>
